# Experiment Configuration Template
# Copy this file and modify for specific experiments

preprocessing:
  patch_size: 1024
  background_fraction: 0.1 # fraction of background patches to save

paths:
  output_dir: "output_imgs/patches4"
  data_dir: "data"
  logging_dir_name: "logs/experiment_{timestamp}"

logging:
  logger_lvl: "info"
  console_handler_lvl: "info"
  file_handler_lvl: "debug"

model:
  architecture: "unet" # unet, deeplabv3, fpn
  encoder_name: "mobilenet_v2" # resnet18, resnet34, resnet50, efficientnet-b0, mobilenet_v2
  encoder_weights: null # imagenet or null
  in_channels: 3
  classes: 6
  learning_rate: 0.001
  batch_size: 2 # Adjust based on GPU memory
  epochs: 50
  device: "cuda" # cpu or cuda

# New: Weights & Biases Configuration
wandb:
  project: "detect-electrical-utility"
  entity: null # Your W&B username/team (null for default)
  run_name: "experiment_{timestamp}"
  tags: ["unet", "mobilenet_v2", "1024_patches", "baseline"]
  log_model: false # Disable model uploads to W&B (save locally only)
  save_code: true # Upload code to W&B
  notes: "Baseline experiment with 1024x1024 patches"
  group: "baseline_experiments" # Group related runs

# New: Metrics Configuration
metrics:
  track: ["iou", "dice", "accuracy", "precision", "recall", "f1"]
  iou_average: "macro" # macro, micro, weighted
  dice_average: "macro"
  f1_average: "macro"
  log_samples: 4 # Number of sample predictions to log per epoch
  sample_indices: [0, 1, 2, 3] # Specific indices to always log

# Training Configuration
training:
  experiment_name: "baseline" # Used for folder naming and W&B grouping
  seed: 42 # Random seed for reproducibility
  gradient_accumulation_steps: 1 # Effective batch size = batch_size * steps
  mixed_precision: false # Enable AMP for faster training (requires compatible GPU)
  early_stopping_patience: 10 # Stop training if no improvement for N epochs
  lr_scheduler: "cosine" # cosine, reduce_on_plateau, step, none
  lr_scheduler_params:
    # Cosine annealing
    T_max: 50 # Maximum number of iterations
    eta_min: 1e-6 # Minimum learning rate
    # Reduce on plateau
    factor: 0.5
    patience: 5
    min_lr: 1e-6
    # Step scheduler
    step_size: 10
    gamma: 0.1
  optimizer: "adam" # adam, sgd, adamw
  optimizer_params:
    # Adam parameters
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    # SGD parameters
    momentum: 0.9
    nesterov: true
  loss_function: "cross_entropy" # cross_entropy, dice, focal, combined
  class_weights: null # null for equal weights, or list of weights per class
  auto_class_weights: false # Automatically calculate class weights from dataset
  loss_alpha: 0.5 # Weight for combined loss (CrossEntropy + Dice)
  loss_gamma: 2.0 # Gamma parameter for focal loss

# New: Data Augmentation Configuration
augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation: 30 # degrees
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  gaussian_blur: true
  blur_kernel_size: 3

# Checkpoint Configuration
checkpoints:
  save_best: true
  save_last: true
  metric_to_monitor: "val_loss" # Metric to determine "best" model
  mode: "min" # Minimize validation loss
  min_delta: 0.001 # Minimum improvement required to save checkpoint
  save_every_n_epochs: null # Save every N epochs regardless of improvement (null to disable)
