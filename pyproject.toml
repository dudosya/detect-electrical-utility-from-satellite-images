[project]
name = "detect-electrical-utility-from-satellite-images"
version = "0.1.0"
description = "ra project to detect electrical utility"
readme = "README.md"
authors = [{ name = "dudosya", email = "kenaykay@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "faster-coco-eval>=1.7.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pillow>=12.0.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytorch-lightning>=2.6.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "scipy>=1.16.3",
    "structlog>=25.1.0",
    "torch",
    "torchvision",
    "typer>=0.20.1",
    "wandb>=0.19.0",
]

[project.scripts]
main = "detect_electrical_utility_from_satellite_images.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=6.0.0", "ruff>=0.9.0", "mypy>=1.14.0"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy configuration
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
