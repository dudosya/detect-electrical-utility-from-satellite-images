augmentation:
  blur_kernel_size: 3
  brightness: 0.2
  contrast: 0.2
  enabled: true
  gaussian_blur: true
  horizontal_flip: 0.5
  rotation: 30
  saturation: 0.2
  vertical_flip: 0.5
checkpoints:
  metric_to_monitor: val_loss
  min_delta: 0.001
  mode: min
  save_best: true
  save_every_n_epochs: null
  save_last: true
logging:
  console_handler_lvl: info
  file_handler_lvl: debug
  logger_lvl: info
metrics:
  dice_average: macro
  f1_average: macro
  iou_average: macro
  log_samples: 4
  sample_indices:
  - 0
  - 1
  - 2
  - 3
  track:
  - iou
  - dice
  - accuracy
  - precision
  - recall
  - f1
model:
  architecture: unet
  batch_size: 2
  classes: 6
  device: cuda
  encoder_name: mobilenet_v2
  encoder_weights: null
  epochs: 50
  in_channels: 3
  learning_rate: 0.001
paths:
  data_dir: data
  logging_dir_name: logs/experiment_{timestamp}
  output_dir: output_imgs/patches4
preprocessing:
  background_fraction: 0.1
  patch_size: 1024
training:
  auto_class_weights: false
  class_weights: null
  early_stopping_patience: 10
  experiment_name: loss_focal
  gradient_accumulation_steps: 1
  loss_alpha: 0.5
  loss_function: focal
  loss_gamma: 2.0
  lr_scheduler: cosine
  lr_scheduler_params:
    T_max: 50
    eta_min: 1e-6
    factor: 0.5
    gamma: 0.1
    min_lr: 1e-6
    patience: 5
    step_size: 10
  mixed_precision: false
  optimizer: adam
  optimizer_params:
    betas:
    - 0.9
    - 0.999
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0001
  seed: 42
wandb:
  entity: null
  group: loss_comparison
  log_model: false
  notes: Focal loss for class imbalance
  project: detect-electrical-utility
  run_name: experiment_{timestamp}
  save_code: true
  tags:
  - loss_comparison
  - focal
