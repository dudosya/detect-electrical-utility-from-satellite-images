preprocessing:
  patch_size: 500
  background_fraction: 0.1 # fraction of background patches to save

paths:
  output_dir: "preprocessed_data/patches"
  data_dir: "raw_data"
  logging_dir_name: "logs"

logging:
  logger_lvl: "debug"
  console_handler_lvl: "info"
  file_handler_lvl: "debug"

# Stage 1: Tower Detection (Faster R-CNN)
tower_detection:
  backbone: "inception_v2"
  anchor_areas: [100, 625, 2500, 10000, 40000] # 10², 25², 50², 100², 200²
  anchor_ratios: [0.5, 1.0, 2.0]
  confidence_threshold: 0.5
  nms_threshold: 0.5

# Stage 2: Line Segmentation (StackNetMTL)
line_segmentation:
  line_width_train: 30
  line_width_inference: 9

# Stage 3: Graph Inference
graph_inference:
  max_distance_m: 600.0
  connectivity_threshold: 0.2
  resolution_m_per_px: 0.3

# Training parameters
training:
  iterations: 5000
  max_epochs: 10
  batch_size: 2
  initial_lr: 0.003
  lr_decay_factor: 0.1
  lr_decay_steps: 10000
  seed: 42
  val_split: 0.1
  num_workers: 0 # 0 for Windows compatibility. 4 or more for mac/linux
  tensor_core_precision: "medium" # "highest", "high", or "medium" (faster)

# Weights & Biases experiment tracking
wandb:
  enabled: true
  project: "gridtracer"
  entity: null # set to your W&B username or team
  tags: ["line-segmentation"] # tower-detection, line-segmentation
  notes: ""
  offline: false
