preprocessing:
  patch_size: 512 # Reduced from 1024 for faster experimentation
  background_fraction: 0.05 # fraction of background patches to save
  classes_to_background: [3] # Remap LINE (class 1) to background - set to null to keep all classes
  target_gsd_cm: 15.0 # Target GSD in cm/pixel for scale normalization (null to disable)
  gsd_tolerance: 0.05 # 5% tolerance - images within this range skip resampling

paths:
  output_dir: "output_imgs/patches_{patch_size}_{experiment_name}"
  data_dir: "data"
  logging_dir_name: "logs/{experiment_name}"

logging:
  logger_lvl: "debug"
  console_handler_lvl: "info"
  file_handler_lvl: "debug"

model:
  architecture: "unet" # unet, deeplabv3, fpn
  encoder_name: "resnet34" # BASELINE: resnet34 is standard, well-documented
  encoder_weights: "imagenet" # IMPORTANT: pretrained weights for faster convergence
  in_channels: 3
  classes: 5 # Reduced from 6 since LINE is now treated as background
  learning_rate: 0.0001 # Lower LR for pretrained models (was 0.001)
  batch_size: 32 # Reduced for ResNet34 memory usage (adjust if GPU allows more)
  epochs: 150 # High ceiling - early stopping will decide when to stop
  device: "cuda" # cpu or cuda

# Weights & Biases Configuration
wandb:
  project: "detect-electrical-utility"
  entity: null # Your W&B username/team (null for default)
  run_name: "baseline_resnet34_{timestamp}"
  tags: ["unet", "resnet34", "imagenet", "512_patches", "baseline"]
  log_model: true # Save model checkpoints to W&B
  save_code: true # Upload code to W&B
  notes: "BASELINE: U-Net + ResNet34 + ImageNet pretrained, combined loss"
  group: "baseline_experiments"

# Metrics Configuration
metrics:
  track:
    [
      "iou",
      "dice",
      "accuracy",
      "precision",
      "recall",
      "f1",
      "boundary_iou",
      "boundary_f1",
    ]
  iou_average: "macro" # macro, micro, weighted
  dice_average: "macro"
  f1_average: "macro"
  boundary_iou_average: "macro"
  boundary_f1_average: "macro"
  boundary_dilation: 2 # Dilation radius for boundary extraction
  log_samples: 2 # Reduced for faster logging
  sample_indices: [0, 1] # Specific indices to always log

# Training Enhancements
training:
  experiment_name: "baseline_resnet34_fixed" # Used for folder naming and W&B grouping
  seed: 42 # Random seed for reproducibility
  gradient_accumulation_steps: 4 # Effective batch size = 8 * 4 = 32
  mixed_precision: true # Enable AMP for faster training (requires compatible GPU)
  early_stopping_patience: 25 # Give model time to learn minority classes
  lr_scheduler: "reduce_on_plateau" # Better for finding optimal LR
  lr_scheduler_params:
    # Cosine annealing
    T_max: 10 # Maximum number of iterations
    eta_min: 0.000001 # Minimum learning rate (1e-6 as float)
    # Reduce on plateau (USING THIS)
    factor: 0.5 # Reduce LR by half when plateau
    patience: 8 # Wait 8 epochs before reducing
    min_lr: 0.000001 # 1e-6 as float
    # Step scheduler
    step_size: 5
    gamma: 0.1
  optimizer: "adamw" # AdamW is better for pretrained models
  optimizer_params:
    # Adam parameters
    betas: [0.9, 0.999]
    weight_decay: 0.01 # Higher weight decay for regularization
    # SGD parameters
    momentum: 0.9
    nesterov: true

  # === CLASS IMBALANCE SETTINGS ===
  loss_function: "combined" # cross_entropy, dice, focal, combined (recommended: focal or combined)
  auto_class_weights: true # Automatically calculate class weights from training data
  class_weights: null # Manual weights (ignored if auto_class_weights is true)
  loss_alpha: 0.5 # For combined loss: weight of CE (0.5 = equal CE + Dice)
  loss_gamma: 2.0 # Focal loss gamma: higher = more focus on hard examples (2.0 is standard)

# Data Augmentation Configuration (simplified for speed)
augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation: 15 # Reduced from 30 for faster augmentation
  brightness: 0.1 # Reduced for faster augmentation
  contrast: 0.1
  saturation: 0.1
  gaussian_blur: false # Disabled for speed
  blur_kernel_size: 3

# Checkpoint Configuration
checkpoints:
  save_best: true
  save_last: true
  metric_to_monitor: "val_loss" # Monitor validation loss for simplicity
  mode: "min" # Minimize validation loss
  save_every_n_epochs: 10
  min_delta: 0.001
