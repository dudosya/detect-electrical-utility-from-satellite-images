preprocessing:
  patch_size: 512 # Reduced from 1024 for faster experimentation
  background_fraction: 0.05 # fraction of background patches to save
  classes_to_background: [] # Remap LINE (class 1) to background - set to null to keep all classes
  fixed_class_order: [1, 2, 3, 4, 5] # Stable mapping after ignoring class 3 -> 1->1,2->2,4->3,5->4
  target_gsd_cm: 15.0 # Target GSD in cm/pixel for scale normalization (null to disable)
  gsd_tolerance: 0.05 # 5% tolerance - images within this range skip resampling

  # CLAHE (Contrast Limited Adaptive Histogram Equalization)
  # Enhances local contrast - RECOMMENDED for detecting thin structures like power lines
  # Applied OFFLINE during preprocessing (slower preprocessing, faster training)
  apply_clahe: true # Set to true to enable CLAHE enhancement (requires opencv-python)
  clahe_clip_limit: 3.0 # Contrast limiting (2.0-4.0 typical). Higher = more contrast, more noise
  clahe_tile_grid_size: [8, 8] # Grid size for local equalization. Smaller = more local adaptation

paths:
  output_dir: "output_imgs/patches_{patch_size}_{experiment_name}"
  data_dir: "data"
  logging_dir_name: "logs/{experiment_name}"

logging:
  logger_lvl: "debug"
  console_handler_lvl: "info"
  file_handler_lvl: "debug"

model:
  architecture: "unet" # unet, deeplabv3, fpn
  encoder_name: "resnet34" # BASELINE: resnet34 is standard, well-documented
  encoder_weights: "imagenet" # IMPORTANT: pretrained weights for faster convergence
  in_channels: 3
  classes: 6 # Reduced from 6 since LINE is now treated as background
  learning_rate: 0.0001 # Lower LR for pretrained models (was 0.001)
  batch_size: 48 # Reduced for ResNet34 memory usage (adjust if GPU allows more)
  epochs: 150 # High ceiling - early stopping will decide when to stop
  device: "cuda" # cpu or cuda

# Weights & Biases Configuration
wandb:
  project: "detect-electrical-utility"
  entity: null # Your W&B username/team (null for default)
  run_name: "baseline_resnet34_{timestamp}"
  tags: ["unet", "resnet34", "imagenet", "512_patches", "baseline", "clahe"]
  log_model: true # Save model checkpoints to W&B
  save_code: true # Upload code to W&B
  notes: "BASELINE: U-Net + ResNet34 + ImageNet pretrained, combined loss"
  group: "baseline_experiments"

# Metrics Configuration
metrics:
  track:
    [
      "iou",
      "dice",
      "accuracy",
      "precision",
      "recall",
      "f1",
      "boundary_iou",
      "boundary_f1",
    ]
  iou_average: "macro" # macro, micro, weighted
  dice_average: "macro"
  f1_average: "macro"
  boundary_iou_average: "macro"
  boundary_f1_average: "macro"
  boundary_dilation: 2 # Dilation radius for boundary extraction
  log_samples: 2 # Reduced for faster logging
  sample_indices: [0, 1] # Specific indices to always log

# Training Enhancements
training:
  experiment_name: "baseline_resnet34_clahe" # Used for folder naming and W&B grouping
  seed: 43 # Random seed for reproducibility
  gradient_accumulation_steps: 4 # Effective batch size = 8 * 4 = 32
  mixed_precision: true # Enable AMP for faster training (requires compatible GPU)
  early_stopping_patience: 10 # Give model time to learn minority classes
  lr_scheduler: "reduce_on_plateau" # Better for finding optimal LR
  lr_scheduler_params:
    # Cosine annealing
    T_max: 10 # Maximum number of iterations
    eta_min: 0.000001 # Minimum learning rate (1e-6 as float)
    # Reduce on plateau (USING THIS)
    factor: 0.5 # Reduce LR by half when plateau
    patience: 8 # Wait 8 epochs before reducing
    min_lr: 0.000001 # 1e-6 as float
    # Step scheduler
    step_size: 5
    gamma: 0.1
  optimizer: "adamw" # AdamW is better for pretrained models
  optimizer_params:
    # Adam parameters
    betas: [0.9, 0.999]
    weight_decay: 0.01 # Higher weight decay for regularization
    # SGD parameters
    momentum: 0.9
    nesterov: true

  # === CLASS IMBALANCE SETTINGS ===
  loss_function: "focal" # cross_entropy, dice, focal, combined (recommended: focal or combined)
  auto_class_weights: true # Automatically calculate class weights from training data
  class_weights: null # Manual weights (ignored if auto_class_weights is true)
  loss_alpha: 0.5 # For combined loss: weight of CE (0.5 = equal CE + Dice)
  loss_gamma: 2.0 # Focal loss gamma: higher = more focus on hard examples (2.0 is standard)

# Data Augmentation Configuration
# Applied ONLINE during training (adds variation, slower per-epoch but better generalization)
# Color jitter/blur help model handle varying lighting and sensor noise in satellite imagery
augmentation:
  enabled: true # Set to false to disable all augmentation
  horizontal_flip: 0.5 # Probability of horizontal flip (power lines can be in any orientation)
  vertical_flip: 0.5 # Probability of vertical flip
  rotation: 15 # Max rotation angle in degrees (reduced from 30 for faster augmentation)
  brightness: 0.1 # Brightness jitter (helps with varying lighting conditions)
  contrast: 0.15 # Contrast jitter (complements CLAHE, adds variation during training)
  saturation: 0.1 # Saturation jitter (handles vegetation/terrain color variations)
  gaussian_blur: false # Blur augmentation (simulates atmospheric effects, disabled for speed)
  blur_kernel_size: 3 # Kernel size for Gaussian blur (must be odd)

# NOTE: ImageNet normalization is automatically applied when encoder_weights="imagenet"

# Checkpoint Configuration
checkpoints:
  save_best: true
  save_last: true
  metric_to_monitor: "val_loss" # Monitor validation loss for simplicity
  mode: "min" # Minimize validation loss
  save_every_n_epochs: 10
  min_delta: 0.001
