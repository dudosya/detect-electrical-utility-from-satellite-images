preprocessing:
  patch_size: 500
  background_fraction: 0.1

paths:
  output_dir: "preprocessed_data/patches"
  data_dir: "raw_data"
  logging_dir_name: "logs"

logging:
  logger_lvl: "debug"
  console_handler_lvl: "info"
  file_handler_lvl: "debug"

# Stage 1: Tower Detection (Faster R-CNN)
tower_detection:
  backbone: "resnet50" # "resnet50" (default), "resnet101", "inception_v2" (paper uses inception_v2)
  anchor_areas: [100, 625, 2500, 10000, 40000] # 10², 25², 50², 100², 200² (paper values for 0.3m imagery)
  anchor_ratios: [0.5, 1.0, 2.0] # aspect ratios for anchor boxes
  confidence_threshold: 0.5 # min score to keep detection (0.0-1.0)
  nms_threshold: 0.5 # IoU threshold for non-maximum suppression (0.0-1.0)

# Stage 2: Line Segmentation (U-Net)
line_segmentation:
  line_width_train: 20 # pixels, dilated line width for training masks
  line_width_inference: 9 # pixels, path width for graph inference scoring
  dropout_rate: 0.1 # dropout for MC Dropout uncertainty (0.0 disables)
  mc_dropout_enabled: true
  mc_dropout_passes: 10
  mc_dropout_log_samples: 4

# Stage 3: Graph Inference
graph_inference:
  max_distance_m: 600.0 # max distance (meters) between connected towers
  connectivity_threshold: 0.2 # min avg probability along path to create edge (0.0-1.0)
  resolution_m_per_px: 0.3 # image resolution in meters per pixel

# Training parameters (optimized for NVIDIA L4 24GB)
training:
  max_epochs: 3
  batch_size: 4 # L4 24GB: 8-16 for tower, 4-8 for line segmentation
  initial_lr: 0.003
  lr_decay_factor: 0.1
  lr_decay_steps: 10000
  seed: 42
  val_split: 0.1 # fraction of data for validation (0.0-0.5)
  split_level: "tile" # "tile" recommended (no leakage), or "patch"
  split_strategy: "within_region" # "within_region" or "region_holdout"
  holdout_regions: [] # e.g., ["NZ_Dunedin"]
  persist_split: true # writes split file under each region patches dir
  split_file_name: "split_tiles.json" # stored under preprocessed_data/patches/<region>/
  min_val_tiles: 1 # ensure at least 1 val tile when possible
  num_workers: 4 # Colab/Linux: 4-8, Windows: 0
  tensor_core_precision: "medium" # "highest", "high", "medium" (medium=TF32, fastest)
  checkpoint_every_n_epochs: 1
  checkpoint_every_n_train_steps: 0 # 0 disables step-based checkpointing
  resume_checkpoint_tower: null
  resume_checkpoint_line: null

# Weights & Biases experiment tracking
wandb:
  enabled: true
  project: "gridtracer" # Base name: tower uses "gridtracer-tower", line uses "gridtracer-line"
  entity: null # your W&B username or team name
  tags: ["tower-detection"]
  notes: ""
  offline: false # true to log locally without internet
